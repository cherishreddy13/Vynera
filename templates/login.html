<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – VYNERA AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@1,300&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #060606;
        --accent: #c9ff00;
        --text: #e8e8e0;
        --muted: #666;
        --card: #0f0f0e;
        --border: #1e1e1c;
        --input: #0a0a09;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        font-family: "DM Sans", sans-serif;
        display: flex;
        flex-direction: column;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
        opacity: 0.035;
        pointer-events: none;
        z-index: 9999;
      }
      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px 48px;
      }
      .logo {
        font-family: "Bebas Neue", sans-serif;
        font-size: 24px;
        letter-spacing: 4px;
        color: var(--accent);
        text-decoration: none;
      }
      .nav-link {
        font-size: 13px;
        color: var(--muted);
        text-decoration: none;
        transition: color 0.2s;
      }
      .nav-link:hover { color: var(--accent); }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        padding: 48px;
        width: 100%;
        max-width: 420px;
      }
      .card-tag {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        letter-spacing: 3px;
        color: var(--accent);
        margin-bottom: 12px;
      }
      .card-title {
        font-family: "Bebas Neue", sans-serif;
        font-size: 56px;
        letter-spacing: 2px;
        line-height: 0.95;
        margin-bottom: 8px;
      }
      .card-sub {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: 16px;
        color: var(--muted);
        margin-bottom: 36px;
      }
      .form-group { margin-bottom: 20px; }
      label {
        display: block;
        font-size: 11px;
        font-family: "JetBrains Mono", monospace;
        letter-spacing: 1.5px;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      input {
        width: 100%;
        background: var(--input);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 14px;
        padding: 12px 16px;
        outline: none;
        border-radius: 2px;
        transition: border-color 0.2s;
      }
      input:focus { border-color: var(--accent); }
      input::placeholder { color: #333; }
      .btn {
        width: 100%;
        background: var(--accent);
        color: #060606;
        font-family: "DM Sans", sans-serif;
        font-weight: 500;
        font-size: 14px;
        letter-spacing: 0.5px;
        padding: 13px 28px;
        border-radius: 2px;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 8px;
      }
      .btn:hover {
        background: #d4ff20;
        box-shadow: 0 0 24px rgba(201, 255, 0, 0.25);
      }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .error-msg {
        background: rgba(255, 80, 80, 0.08);
        border: 1px solid rgba(255, 80, 80, 0.3);
        color: #ff6060;
        font-size: 13px;
        padding: 12px 16px;
        border-radius: 2px;
        margin-bottom: 16px;
        display: none;
      }
      .error-msg.show { display: block; }
      .divider {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 24px 0;
      }
      .divider span { font-size: 12px; color: var(--muted); }
      .divider::before, .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }
      .link-row {
        text-align: center;
        font-size: 13px;
        color: var(--muted);
      }
      .link-row a { color: var(--accent); text-decoration: none; }
      .link-row a:hover { text-decoration: underline; }
      .forgot {
        display: block;
        text-align: right;
        font-size: 11px;
        color: var(--muted);
        text-decoration: none;
        margin-top: 4px;
        transition: color 0.2s;
      }
      .forgot:hover { color: var(--accent); }
      @media (max-width: 480px) {
        nav { padding: 20px; }
        .card { padding: 32px 24px; }
        .card-title { font-size: 40px; }
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="/" class="logo">VYNERA</a>
      <a href="/signup" class="nav-link">No account? Sign up →</a>
    </nav>
    <main>
      <div class="card">
        <div class="card-tag">// Returning User</div>
        <h1 class="card-title">Welcome<br />Back.</h1>
        <p class="card-sub">Your companion is waiting.</p>

        <div class="error-msg" id="errorMsg"></div>

        <form id="loginForm">
          <div class="form-group">
            <label>Email or Username</label>
            <input type="text" id="identifier" placeholder="you@example.com" required autocomplete="username" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
            <a href="#" class="forgot">Forgot password?</a>
          </div>
          <button type="submit" class="btn" id="loginBtn">Login</button>
        </form>

        <div class="divider"><span>or</span></div>
        <div class="link-row">
          New here? <a href="/signup">Create your account</a>
        </div>
      </div>
    </main>

    <script>
      // Already logged in → redirect
      if (localStorage.getItem('vynera_token')) window.location.href = '/dashboard';

      const form = document.getElementById('loginForm');
      const btn  = document.getElementById('loginBtn');
      const errorMsg = document.getElementById('errorMsg');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.classList.remove('show');
        btn.textContent = 'Logging in...';
        btn.disabled = true;

        const identifier = document.getElementById('identifier').value.trim();
        const password   = document.getElementById('password').value;

        try {
          // FIXED: /api/auth/login (was /login)
          const resp = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier, password }),
          });
          const data = await resp.json();
          if (resp.ok && data.token) {
            // FIXED: data.token (was data.access_token)
            localStorage.setItem('vynera_token', data.token);
            localStorage.setItem('vynera_user', JSON.stringify(data.user));
            window.location.href = '/dashboard';
          } else {
            errorMsg.textContent = data.detail || 'Invalid credentials.';
            errorMsg.classList.add('show');
          }
        } catch {
          errorMsg.textContent = 'Network error. Please try again.';
          errorMsg.classList.add('show');
        } finally {
          btn.textContent = 'Login';
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
