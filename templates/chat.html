<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>Chat – VYNERA AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@1,300&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #060606;
        --accent: #c9ff00;
        --text: #e8e8e0;
        --muted: #555;
        --card: #0c0c0b;
        --border: #1c1c1a;
        --user-bubble: #141412;
        --bot-bubble: #0c0c0b;
        --sidebar-width: 280px;
        --sidebar-width-mobile: 260px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        font-family: "DM Sans", sans-serif;
        overflow: hidden;
        position: fixed;
        width: 100%;
        top: 0;
        left: 0;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
        opacity: 0.035;
        pointer-events: none;
        z-index: 9999;
      }

      .layout {
        display: flex;
        height: 100vh;
        width: 100%;
        position: relative;
      }

      /* Sidebar base (desktop) */
      .sidebar {
        width: var(--sidebar-width);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        background: var(--bg);
        transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        z-index: 20;
        overflow-y: auto;
      }
      
      .sidebar-top {
        padding: 20px;
        border-bottom: 1px solid var(--border);
      }
      .logo {
        font-family: "Bebas Neue", sans-serif;
        font-size: 20px;
        letter-spacing: 4px;
        color: var(--accent);
      }
      .sidebar-nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 12px 0;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 20px;
        font-size: 12px;
        color: var(--muted);
        text-decoration: none;
        transition: all 0.2s;
        border-left: 2px solid transparent;
      }
      .nav-item:hover,
      .nav-item.active {
        color: var(--text);
        border-left-color: var(--accent);
      }

      .sidebar-section {
        padding: 16px 20px;
        border-top: 1px solid var(--border);
        flex: 1;
        overflow-y: auto;
      }
      .section-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 9px;
        letter-spacing: 2px;
        color: var(--muted);
        margin-bottom: 12px;
        text-transform: uppercase;
      }

      .mem-chip {
        background: var(--card);
        border: 1px solid var(--border);
        padding: 8px 10px;
        margin-bottom: 6px;
        border-radius: 2px;
      }
      .mem-k {
        font-family: "JetBrains Mono", monospace;
        font-size: 9px;
        color: var(--accent);
      }
      .mem-v {
        font-size: 11px;
        color: var(--text);
        margin-top: 2px;
      }

      .goal-mini {
        border-bottom: 1px solid var(--border);
        padding: 8px 0;
      }
      .goal-mini:last-child {
        border-bottom: none;
      }
      .goal-mini-name {
        font-size: 11px;
        margin-bottom: 4px;
      }
      .mini-bar {
        height: 2px;
        background: var(--border);
        border-radius: 1px;
      }
      .mini-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 1px;
      }

      .new-chat-btn {
        margin: 12px 20px;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
        padding: 10px;
        cursor: pointer;
        transition: all 0.2s;
        border-radius: 2px;
        width: calc(100% - 40px);
      }
      .new-chat-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* Chat area */
      .chat-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        width: 100%;
        position: relative;
      }
      .chat-header {
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        background: var(--bg);
        gap: 12px;
        flex-wrap: wrap;
      }
      .chat-header-left {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
      }
      .chat-header-name {
        font-family: "Bebas Neue", sans-serif;
        font-size: 22px;
        letter-spacing: 2px;
      }
      .chat-header-sub {
        font-size: 11px;
        color: var(--muted);
      }
      .emotion-badge {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        padding: 4px 10px;
        border: 1px solid var(--border);
        border-radius: 20px;
        color: var(--muted);
        white-space: nowrap;
      }

      .mobile-menu-toggle {
        display: none;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--accent);
        font-size: 20px;
        cursor: pointer;
        width: 36px;
        height: 36px;
        border-radius: 4px;
        align-items: center;
        justify-content: center;
        margin-right: 8px;
        transition: all 0.2s;
      }
      .mobile-menu-toggle:hover {
        background: rgba(201, 255, 0, 0.05);
        border-color: var(--accent);
      }
      
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.7);
        backdrop-filter: blur(3px);
        z-index: 15;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }
      .sidebar-overlay.active {
        display: block;
        opacity: 1;
        pointer-events: auto;
      }

      /* Messages */
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        scroll-behavior: smooth;
      }
      .messages::-webkit-scrollbar {
        width: 4px;
      }
      .messages::-webkit-scrollbar-track {
        background: transparent;
      }
      .messages::-webkit-scrollbar-thumb {
        background: var(--border);
      }

      .msg-row {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        animation: msgIn 0.3s ease;
      }
      .msg-row.user {
        flex-direction: row-reverse;
      }
      @keyframes msgIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-family: "JetBrains Mono", monospace;
      }
      .avatar.bot {
        background: rgba(201, 255, 0, 0.1);
        border: 1px solid rgba(201, 255, 0, 0.2);
        color: var(--accent);
      }
      .avatar.user {
        background: var(--card);
        border: 1px solid var(--border);
        color: var(--muted);
      }

      .bubble {
        max-width: 70%;
        padding: 14px 16px;
        border-radius: 2px;
        font-size: 14px;
        line-height: 1.65;
        position: relative;
        word-break: break-word;
      }
      .bubble.bot {
        background: var(--bot-bubble);
        border: 1px solid var(--border);
        border-radius: 2px 12px 12px 2px;
      }
      .bubble.user {
        background: var(--user-bubble);
        border: 1px solid var(--border);
        border-radius: 12px 2px 2px 12px;
        text-align: left;
      }

      .feedback-row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .fb-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
        padding: 4px 10px;
        cursor: pointer;
        border-radius: 20px;
        transition: all 0.2s;
      }
      .fb-btn:hover.up {
        border-color: #00cc66;
        color: #00cc66;
      }
      .fb-btn:hover.down {
        border-color: #cc4400;
        color: #cc4400;
      }
      .fb-btn.voted-up {
        border-color: #00cc66;
        color: #00cc66;
      }
      .fb-btn.voted-down {
        border-color: #cc4400;
        color: #cc4400;
      }

      .typing-indicator {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 0 0 8px;
      }
      .typing-indicator.show {
        display: flex;
      }
      .typing-dots {
        display: flex;
        gap: 4px;
      }
      .dot {
        width: 6px;
        height: 6px;
        background: var(--muted);
        border-radius: 50%;
        animation: dotBounce 1.2s infinite;
      }
      .dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dot:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes dotBounce {
        0%,
        60%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-6px);
        }
      }

      /* Input area - raised on mobile for better access */
      .input-area {
        padding: 16px 24px;
        border-top: 1px solid var(--border);
        flex-shrink: 0;
        background: var(--bg);
      }
      .input-wrap {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }
      .message-input {
        flex: 1;
        background: var(--card);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 14px;
        padding: 12px 16px;
        outline: none;
        border-radius: 2px;
        resize: none;
        min-height: 44px;
        max-height: 140px;
        transition: border-color 0.2s;
        line-height: 1.5;
      }
      .message-input:focus {
        border-color: rgba(201, 255, 0, 0.4);
      }
      .message-input::placeholder {
        color: #333;
      }
      .send-btn {
        background: var(--accent);
        border: none;
        color: #060606;
        width: 44px;
        height: 44px;
        border-radius: 2px;
        cursor: pointer;
        font-size: 16px;
        transition: all 0.2s;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .send-btn:hover {
        background: #d4ff20;
        box-shadow: 0 0 16px rgba(201, 255, 0, 0.3);
      }
      .send-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .mode-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .mode-tab {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 11px;
        font-family: "JetBrains Mono", monospace;
        padding: 5px 12px;
        cursor: pointer;
        border-radius: 20px;
        transition: all 0.2s;
      }
      .mode-tab.active,
      .mode-tab:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* ===== MOBILE RESPONSIVE + RAISED INPUT AREA ===== */
      @media (max-width: 768px) {
        .mobile-menu-toggle {
          display: flex;
        }
        .sidebar {
          position: fixed;
          top: 0;
          left: 0;
          height: 100vh;
          width: var(--sidebar-width-mobile);
          transform: translateX(-100%);
          z-index: 30;
          box-shadow: 2px 0 20px rgba(0,0,0,0.8);
          transition: transform 0.25s ease-out;
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .chat-header {
          padding: 12px 16px;
        }
        .chat-header-left {
          flex: 1;
        }
        .chat-header-name {
          font-size: 18px;
        }
        .emotion-badge {
          font-size: 9px;
          padding: 3px 8px;
        }
        .messages {
          padding: 16px;
          gap: 16px;
          padding-bottom: 10px;
        }
        .bubble {
          max-width: 85%;
          padding: 12px 14px;
          font-size: 13px;
        }
        .avatar {
          width: 28px;
          height: 28px;
          font-size: 11px;
        }
        
        /* KEY FIX: input area raised and more accessible */
        .input-area {
          padding: 12px 16px 20px 16px;
          background: var(--bg);
          border-top: 1px solid var(--border);
          /* ensure it's above everything but not overlapped by keyboard */
          position: relative;
          z-index: 10;
        }
        
        .mode-tabs {
          gap: 6px;
          margin-bottom: 10px;
        }
        .mode-tab {
          padding: 5px 10px;
          font-size: 10px;
        }
        
        .message-input {
          font-size: 15px; /* slightly larger for touch */
          padding: 12px 14px;
          min-height: 46px;
        }
        .send-btn {
          width: 46px;
          height: 46px;
        }
        
        .feedback-row {
          gap: 6px;
        }
        .fb-btn {
          font-size: 10px;
          padding: 3px 8px;
        }
        .typing-indicator {
          padding-left: 8px;
          margin-bottom: 4px;
        }
        
        /* Ensure the messages container doesn't get squashed */
        .chat-area {
          height: 100vh;
        }
      }

      /* Extra small devices (iPhone SE, small Android) - input even more accessible */
      @media (max-width: 480px) {
        .bubble {
          max-width: 92%;
        }
        .chat-header-sub {
          font-size: 9px;
        }
        .emotion-badge {
          font-size: 8px;
        }
        .messages {
          padding: 12px;
          padding-bottom: 8px;
        }
        .input-area {
          padding: 10px 12px 18px 12px;
        }
        .mode-tabs {
          margin-bottom: 8px;
        }
        .message-input {
          font-size: 15px;
          padding: 11px 12px;
        }
        .send-btn {
          width: 44px;
          height: 44px;
        }
      }

      /* landscape phones - keep input comfortable */
      @media (max-width: 768px) and (orientation: landscape) {
        .messages {
          max-height: calc(100vh - 130px);
        }
        .chat-header {
          padding: 8px 16px;
        }
        .input-area {
          padding: 8px 16px 12px 16px;
        }
        .mode-tabs {
          margin-bottom: 6px;
        }
      }
      
      /* For very tall screens or devices with notch, safe area */
      @supports (padding-bottom: env(safe-area-inset-bottom)) {
        .input-area {
          padding-bottom: max(16px, env(safe-area-inset-bottom));
        }
        @media (max-width: 768px) {
          .input-area {
            padding-bottom: max(18px, env(safe-area-inset-bottom));
          }
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <!-- Mobile Overlay -->
      <div class="sidebar-overlay" id="sidebarOverlay"></div>
      
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <div class="logo">VYNERA</div>
        </div>
        <div class="sidebar-nav">
          <a href="/dashboard" class="nav-item">◈ Dashboard</a>
          <a href="/chat" class="nav-item active">◎ Chat</a>
          <a href="/history" class="nav-item">◷ History</a>
          <a href="/profile" class="nav-item">◉ Profile</a>
        </div>
        <button class="new-chat-btn" id="newChatBtn">+ New Conversation</button>

        <div class="sidebar-section">
          <div class="section-label">Memories</div>
          <div id="sidebarMemories">
            <div style="color: var(--muted); font-size: 11px">
              Chat to build memories.
            </div>
          </div>
        </div>

        <div
          class="sidebar-section"
          style="border-top: 1px solid var(--border)"
        >
          <div class="section-label">Goals</div>
          <div id="sidebarGoals">
            <div style="color: var(--muted); font-size: 11px">
              No active goals.
            </div>
          </div>
        </div>
      </aside>

      <!-- Chat -->
      <div class="chat-area">
        <div class="chat-header">
          <div style="display: flex; align-items: center; gap: 8px;">
            <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Menu">☰</button>
            <div class="chat-header-left">
              <div class="chat-header-name">VYNERA</div>
              <div class="chat-header-sub" id="connStatus">Connecting...</div>
            </div>
          </div>
          <div class="emotion-badge" id="emotionBadge">– neutral</div>
        </div>

        <div class="messages" id="messages">
          <!-- Messages will be inserted here -->
        </div>

        <div style="padding: 0 24px">
          <div class="typing-indicator" id="typingIndicator">
            <div class="avatar bot">V</div>
            <div class="typing-dots">
              <div class="dot"></div>
              <div class="dot"></div>
              <div class="dot"></div>
            </div>
          </div>
        </div>

        <div class="input-area">
          <div class="mode-tabs">
            <button class="mode-tab active" data-mode="chat">Chat</button>
            <button class="mode-tab" data-mode="journal">Journal</button>
            <button class="mode-tab" data-mode="goals">Goals</button>
            <button class="mode-tab" data-mode="reason">Reason</button>
          </div>
          <div class="input-wrap">
            <textarea
              class="message-input"
              id="messageInput"
              placeholder="Say anything..."
              rows="1"
            ></textarea>
            <button class="send-btn" id="sendBtn">➤</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile drawer & accessibility enhancements (pure UI, no backend changes) -->
    <script>
      (function() {
        // Sidebar drawer logic (no backend interference)
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const toggleBtn = document.getElementById('mobileMenuToggle');
        
        if (toggleBtn && sidebar && overlay) {
          const closeDrawer = () => {
            if (sidebar.classList.contains('open')) {
              sidebar.classList.remove('open');
              overlay.classList.remove('active');
              document.body.style.overflow = '';
            }
          };
          
          const openDrawer = () => {
            sidebar.classList.add('open');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
          };
          
          toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (sidebar.classList.contains('open')) {
              closeDrawer();
            } else {
              openDrawer();
            }
          });
          
          overlay.addEventListener('click', closeDrawer);
          
          window.addEventListener('resize', () => {
            if (window.innerWidth > 768 && sidebar.classList.contains('open')) {
              closeDrawer();
            }
          });
          
          const navLinks = document.querySelectorAll('.sidebar-nav .nav-item');
          navLinks.forEach(link => {
            link.addEventListener('click', () => {
              if (window.innerWidth <= 768 && sidebar.classList.contains('open')) {
                closeDrawer();
              }
            });
          });
          
          const newChatBtn = document.getElementById('newChatBtn');
          if (newChatBtn) {
            newChatBtn.addEventListener('click', () => {
              if (window.innerWidth <= 768 && sidebar.classList.contains('open')) {
                closeDrawer();
              }
            });
          }
        }
        
        // Auto-resize textarea (preserves original behavior)
        const textarea = document.getElementById('messageInput');
        if (textarea) {
          const adjustHeight = () => {
            textarea.style.height = 'auto';
            let newHeight = Math.min(textarea.scrollHeight, 140);
            textarea.style.height = newHeight + 'px';
          };
          textarea.addEventListener('input', adjustHeight);
          adjustHeight();
        }
        
        // Optional: ensure keyboard doesn't obscure input on mobile by scrolling into view
        const inputWrap = document.querySelector('.input-area');
        const messageInput = document.getElementById('messageInput');
        if (messageInput && inputWrap) {
          messageInput.addEventListener('focus', () => {
            setTimeout(() => {
              if (window.innerWidth <= 768) {
                messageInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
              }
            }, 100);
          });
        }
        
        // Keep original chat.js untouched - no overrides or modifications to event handlers
      })();
    </script>
    <!-- Original backend chat.js remains exactly as intended, no changes -->
    <script src="/static/js/chat.js"></script>
  </body>
</html>
