<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>History – VYNERA AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@1,300&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #060606;
        --accent: #c9ff00;
        --text: #e8e8e0;
        --muted: #666;
        --card: #0c0c0b;
        --border: #1e1e1c;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        font-family: "DM Sans", sans-serif;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
        opacity: 0.035;
        pointer-events: none;
        z-index: 9999;
      }
      .layout {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 220px;
        border-right: 1px solid var(--border);
        padding: 28px 0;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
      }
      .sidebar-logo {
        font-family: "Bebas Neue", sans-serif;
        font-size: 22px;
        letter-spacing: 4px;
        color: var(--accent);
        padding: 0 24px;
        margin-bottom: 40px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 24px;
        font-size: 13px;
        color: var(--muted);
        text-decoration: none;
        transition: all 0.2s;
        border-left: 2px solid transparent;
      }
      .nav-item:hover,
      .nav-item.active {
        color: var(--text);
        border-left-color: var(--accent);
      }
      .nav-item.active {
        color: var(--accent);
      }
      .main {
        flex: 1;
        padding: 48px;
        max-width: 900px;
      }
      .page-tag {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        letter-spacing: 3px;
        color: var(--accent);
        margin-bottom: 8px;
      }
      .page-title {
        font-family: "Bebas Neue", sans-serif;
        font-size: 52px;
        letter-spacing: 2px;
        margin-bottom: 32px;
      }
      .search-bar {
        display: flex;
        gap: 12px;
        margin-bottom: 32px;
      }
      .search-input {
        flex: 1;
        background: #0a0a09;
        border: 1px solid var(--border);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 14px;
        padding: 12px 16px;
        outline: none;
        border-radius: 2px;
        transition: border-color 0.2s;
      }
      .search-input:focus {
        border-color: var(--accent);
      }
      .search-input::placeholder {
        color: #333;
      }
      .search-btn {
        background: var(--accent);
        color: #060606;
        border: none;
        font-size: 13px;
        font-weight: 500;
        padding: 12px 20px;
        cursor: pointer;
        border-radius: 2px;
        transition: all 0.2s;
      }
      .search-btn:hover {
        background: #d4ff20;
      }
      .conv-list {
        display: flex;
        flex-direction: column;
        gap: 1px;
        background: var(--border);
      }
      .conv-item {
        background: var(--bg);
        padding: 20px 24px;
        cursor: pointer;
        transition: background 0.2s;
        border-left: 3px solid transparent;
      }
      .conv-item:hover {
        background: var(--card);
        border-left-color: var(--accent);
      }
      .conv-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 6px;
      }
      .conv-title {
        font-size: 14px;
        font-weight: 500;
      }
      .conv-date {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        color: var(--muted);
      }
      .conv-preview {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
        max-width: 600px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .conv-meta {
        display: flex;
        gap: 12px;
        margin-top: 6px;
      }
      .meta-pill {
        font-family: "JetBrains Mono", monospace;
        font-size: 9px;
        padding: 3px 8px;
        border: 1px solid var(--border);
        border-radius: 20px;
        color: var(--muted);
      }
      .empty {
        text-align: center;
        padding: 80px;
        color: var(--muted);
      }
      .empty-title {
        font-family: "Bebas Neue", sans-serif;
        font-size: 32px;
        margin-bottom: 8px;
      }

      /* Conv detail panel */
      .detail-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        z-index: 400;
        display: none;
        align-items: flex-start;
        justify-content: flex-end;
      }
      .detail-overlay.show {
        display: flex;
      }
      .detail-panel {
        background: var(--bg);
        border-left: 1px solid var(--border);
        width: min(640px, 100vw);
        height: 100vh;
        display: flex;
        flex-direction: column;
        animation: slideIn 0.25s ease;
      }
      @keyframes slideIn {
        from {
          transform: translateX(40px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      .detail-header {
        padding: 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
      }
      .detail-title {
        font-family: "Bebas Neue", sans-serif;
        font-size: 24px;
        letter-spacing: 1px;
      }
      .close-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        width: 32px;
        height: 32px;
        cursor: pointer;
        border-radius: 2px;
        font-size: 16px;
        transition: all 0.2s;
      }
      .close-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .detail-messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .detail-msg {
        padding: 12px 16px;
        border-radius: 2px;
        font-size: 13px;
        line-height: 1.65;
        max-width: 85%;
      }
      .detail-msg.user {
        background: #141412;
        border: 1px solid var(--border);
        align-self: flex-end;
        border-radius: 12px 2px 2px 12px;
      }
      .detail-msg.bot {
        background: var(--card);
        border: 1px solid var(--border);
        align-self: flex-start;
        border-radius: 2px 12px 12px 2px;
      }
      .detail-role {
        font-family: "JetBrains Mono", monospace;
        font-size: 9px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .detail-emotion {
        font-family: "JetBrains Mono", monospace;
        font-size: 9px;
        color: var(--accent);
        margin-top: 4px;
      }

      .pagination {
        display: flex;
        gap: 8px;
        margin-top: 24px;
      }
      .page-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
        padding: 8px 16px;
        cursor: pointer;
        border-radius: 2px;
        transition: all 0.2s;
      }
      .page-btn:hover,
      .page-btn.active {
        border-color: var(--accent);
        color: var(--accent);
      }
      .page-btn:disabled {
        opacity: 0.3;
        cursor: default;
      }

      @media (max-width: 768px) {
        .sidebar {
          display: none;
        }
        .main {
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-logo">VYNERA</div>
        <a href="/dashboard" class="nav-item">◈ Dashboard</a>
        <a href="/chat" class="nav-item">◎ Chat</a>
        <a href="/history" class="nav-item active">◷ History</a>
        <a href="/profile" class="nav-item">◉ Profile</a>
      </aside>
      <main class="main">
        <div class="page-tag">// Conversation Archive</div>
        <h1 class="page-title">Chat History</h1>

        <div class="search-bar">
          <input
            class="search-input"
            id="searchInput"
            placeholder="Search by topic, date, or keyword..."
            type="text"
          />
          <button class="search-btn" onclick="searchConvs()">Search</button>
        </div>

        <div id="convList"></div>
        <div class="pagination" id="pagination"></div>
      </main>
    </div>

    <!-- Detail Panel -->
    <div class="detail-overlay" id="detailOverlay" onclick="closeDetail(event)">
      <div class="detail-panel" id="detailPanel">
        <div class="detail-header">
          <div class="detail-title" id="detailTitle">Conversation</div>
          <button class="close-btn" onclick="closeDetailPanel()">✕</button>
        </div>
        <div class="detail-messages" id="detailMessages"></div>
      </div>
    </div>

    <script>
      const token = localStorage.getItem("vynera_token");
      if (!token) window.location.href = "/login";

      let currentPage = 0;
      const PAGE_SIZE = 20;
      let allConvs = [];

      async function loadConvs(search = "") {
        try {
          const url = `/api/conversations?search=${encodeURIComponent(search)}&limit=200`;
          const r = await fetch(url, {
            headers: { Authorization: "Bearer " + token },
          });
          if (r.status === 401) {
            window.location.href = "/login";
            return;
          }
          allConvs = await r.json();
          currentPage = 0;
          renderPage();
        } catch (e) {
          console.error(e);
        }
      }

      function formatDate(str) {
        if (!str) return "–";
        try {
          return new Date(str).toLocaleDateString("en-IN", {
            day: "numeric",
            month: "short",
            year: "numeric",
          });
        } catch {
          return str;
        }
      }

      function renderPage() {
        const start = currentPage * PAGE_SIZE;
        const page = allConvs.slice(start, start + PAGE_SIZE);
        const listEl = document.getElementById("convList");

        if (!allConvs.length) {
          listEl.innerHTML = `<div class="empty"><div class="empty-title">No Conversations Yet</div><p style="font-size:13px;">Start chatting to see your history here.</p></div>`;
          document.getElementById("pagination").innerHTML = "";
          return;
        }

        listEl.innerHTML = `<div class="conv-list">${page
          .map((c) => {
            const msgs = c.messages || [];
            const lastMsg = msgs.length ? msgs[msgs.length - 1] : null;
            const preview = lastMsg
              ? lastMsg.content.substring(0, 120)
              : "No messages";
            const count = msgs.length;
            return `<div class="conv-item" onclick="openDetail('${c._id}','${(c.title || "Conversation").replace(/'/g, "\\'")}')">
      <div class="conv-top">
        <div class="conv-title">${c.title || "Conversation"}</div>
        <div class="conv-date">${formatDate(c.created_at)}</div>
      </div>
      <div class="conv-preview">${preview}</div>
      <div class="conv-meta">
        <span class="meta-pill">${count} messages</span>
        ${c.topic ? `<span class="meta-pill">${c.topic}</span>` : ""}
      </div>
    </div>`;
          })
          .join("")}</div>`;

        renderPagination();
      }

      function renderPagination() {
        const total = Math.ceil(allConvs.length / PAGE_SIZE);
        if (total <= 1) {
          document.getElementById("pagination").innerHTML = "";
          return;
        }
        let html = `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 0 ? "disabled" : ""}>← Prev</button>`;
        for (let i = 0; i < total; i++) {
          html += `<button class="page-btn ${i === currentPage ? "active" : ""}" onclick="goPage(${i})">${i + 1}</button>`;
        }
        html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === total - 1 ? "disabled" : ""}>Next →</button>`;
        document.getElementById("pagination").innerHTML = html;
      }

      function goPage(p) {
        const total = Math.ceil(allConvs.length / PAGE_SIZE);
        if (p < 0 || p >= total) return;
        currentPage = p;
        renderPage();
        window.scrollTo(0, 0);
      }

      function searchConvs() {
        const q = document.getElementById("searchInput").value.trim();
        loadConvs(q);
      }

      document
        .getElementById("searchInput")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") searchConvs();
        });

      async function openDetail(convId, title) {
        document.getElementById("detailTitle").textContent = title;
        document.getElementById("detailMessages").innerHTML =
          '<div style="color:var(--muted);text-align:center;padding:40px;font-size:13px;">Loading...</div>';
        document.getElementById("detailOverlay").classList.add("show");

        try {
          const r = await fetch(`/api/conversations/${convId}`, {
            headers: { Authorization: "Bearer " + token },
          });
          const data = await r.json();
          const msgs = data.messages || [];
          document.getElementById("detailMessages").innerHTML =
            msgs
              .map(
                (m) => `
      <div class="detail-msg ${m.role}">
        <div class="detail-role">${m.role === "user" ? "// YOU" : "// VYNERA"}</div>
        ${m.content}
        ${m.emotion ? `<div class="detail-emotion">◎ ${m.emotion} (${Math.round((m.intensity || 0) * 100)}%)</div>` : ""}
      </div>
    `,
              )
              .join("") ||
            '<div style="color:var(--muted);font-size:13px;">No messages in this conversation.</div>';
        } catch {
          document.getElementById("detailMessages").innerHTML =
            '<div style="color:#cc4444;text-align:center;padding:40px;">Failed to load.</div>';
        }
      }

      function closeDetail(e) {
        if (e.target === document.getElementById("detailOverlay"))
          closeDetailPanel();
      }
      function closeDetailPanel() {
        document.getElementById("detailOverlay").classList.remove("show");
      }

      loadConvs();
    </script>
  </body>
</html>
